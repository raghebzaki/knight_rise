# App icons, generated from the extracted Knight shield (assets/branding/):
#   dart run flutter_launcher_icons
#   git checkout ios/Runner.xcodeproj/project.pbxproj   # the tool rewrites an unrelated
#   # build setting (ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS) to an invalid value
# Android: adaptive icon (background colour + foreground in the 66 % safe zone)
# with a monochrome layer for Android 13 themed icons. iOS: opaque app_icon.png.
flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 26
  image_path_android: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0A0F1D"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
  # The foreground PNG already keeps the shield inside the 66 % safe zone.
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0A0F1D"
