name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          files=$(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v -E '\.(g|freezed|config)\.dart$|l10n/generated' || true)
          dart format --set-exit-if-changed -l 120 $files

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
