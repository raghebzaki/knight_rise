name: Pages

# Publishes only site/ (the privacy policy) to GitHub Pages.
# Enable once: Settings › Pages › Build and deployment › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unfilled placeholders
        run: |
          if grep -rn '{{CONTACT_EMAIL}}\|{{GITHUB_USER}}' site/; then
            echo "Fill in the placeholders in site/ before publishing (docs/RELEASE.md, step 6)." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
