name: knight_rise
description: "Knight Rise — Stay Active. Stay Focused. Break, hydration and eye-rest reminders for desk workers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  timezone: ^0.11.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_timezone: ^5.1.1
  meta: ^1.19.0
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  android_intent_plus: ^6.1.0
  device_info_plus: ^13.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  drift_dev: ^2.35.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  # Animated splash layers only; the rest of assets/branding/ is source artwork.
  assets:
    - assets/branding/splash_mark.png
    - assets/branding/splash_crest_glow.png

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
