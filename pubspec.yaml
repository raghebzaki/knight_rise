name: knight_rise
description: "Knight Rise — Stay Active. Stay Focused. Break, hydration and eye-rest reminders for desk workers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  timezone: ^0.11.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  ffi: ^2.1.3
  flutter_timezone: ^5.1.1
  meta: ^1.19.0
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  android_intent_plus: ^6.1.0
  device_info_plus: ^13.3.0
  fl_chart: ^1.2.0
  window_manager: 0.5.2
  tray_manager: 0.5.3
  win32_registry: ^3.0.3
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  drift_dev: ^2.35.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3
  msix: 3.18.0
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  generate: true

  # Animated splash layers only; the rest of assets/branding/ is source artwork.
  assets:
    - assets/branding/splash_mark.png
    - assets/branding/splash_crest_glow.png
    # Desktop tray icons (see tool/gen_tray_icons.py); resolved by file name on disk.
    - assets/branding/tray/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Windows MSIX package (`dart run msix:create`, see docs/RELEASE.md and docs/QA_DESKTOP.md).
# test/core/config/msix_config_test.dart keeps the identifiers below in sync with the Dart constants.
msix_config:
  display_name: Knight Rise
  # Shown in the installer. Not the signing identity: that is the certificate's Subject, which msix reads from the
  # certificate (the msix test certificate for testers). A Store or real-certificate build must also pass
  # `--publisher "<certificate Subject>"`, and the Subject must match the manifest Publisher exactly.
  publisher_display_name: com.ragheb
  # Same string as kWindowsAppUserModelId. An unpackaged build registers that string as its AppUserModelID; a packaged
  # build gets "<PackageFamilyName>!App" instead and the notification plugin switches to package identity.
  # Keeping them equal makes the package name recognisable next to the unpackaged AUMID in logs and registry.
  identity_name: com.ragheb.KnightRise
  # a.b.c.d from pubspec `version` (1.0.0+1 -> 1.0.0.0). The last part must stay 0 for Microsoft Store uploads.
  msix_version: 1.0.0.0
  logo_path: assets/branding/app_icon.png
  # No `capabilities:` on purpose: an offline app needs no internetClient or other capability (msix always adds the
  # mandatory runFullTrust for a desktop app).
  languages: en-us, ar
  output_name: knight_rise
  architecture: x64
  # CI and tool/ scripts run `flutter build windows --release` first.
  build_windows: false
  store: false
  # Launch at login is on by default; the user can turn it off in Settings > Apps > Startup. `--autostart` makes the
  # runner start hidden (windows/runner/main.cpp) and is what LaunchArguments.autostart reads in Dart.
  startup_task:
    task_id: KnightRiseStartup
    enabled: true
    parameters: --autostart
  # COM activator for toast clicks and actions; same GUID as kWindowsToastActivatorGuid. The arguments are what
  # Windows passes when it has to start a closed app for a toast (cold start); a running app is activated in-process.
  toast_activator:
    clsid: 108AF7F5-1A25-4D8E-A8F4-83AF0606E992
    arguments: -ToastActivated
    display_name: Knight Rise
