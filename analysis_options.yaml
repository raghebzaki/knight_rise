include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "lib/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Keep conventional `ClassName(...)` constructors; the team can adopt
    # Dart 3.13 `new(...)` declaring constructors later in one sweep.
    unnecessary_type_name_in_constructor: false
    sort_pub_dependencies: false
