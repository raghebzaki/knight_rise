# Splash screens. Run after adding the artwork in assets/branding/ (docs/RELEASE.md):
#   dart run flutter_native_splash:create
# The app is dark-only, so there is no separate dark variant.
flutter_native_splash:
  color: "#0A1020"
  image: assets/branding/splash_icon.png
  android_12:
    # Android 12+ SplashScreen API: icon without its own background.
    image: assets/branding/splash_icon_android12.png
    color: "#0A1020"
  android: true
  ios: true
  web: false
  fullscreen: false
